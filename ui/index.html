<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkflowGPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/*
  WorkflowGPS design tokens (from the Waypoint 3D design)
    --inbound  (amber)  raw context travelling INTO the brain
    --outbound (mint)   coordinated direction + learning travelling OUT
    --alert    (coral)  blockers / urgent only
  Radius: panels 14px, cards 10px, buttons + chips + tabs full pill.
*/
:root{
  --bg:#060A12; --bg-2:#0A101C; --surface:#0E1525; --surface-2:#131C2F;
  --line:rgba(148,170,210,.12); --line-2:rgba(148,170,210,.22);
  --text:#E6ECF5; --muted:#8E9BB2; --faint:#64718A;
  --inbound:#F3A73B; --inbound-soft:rgba(243,167,59,.14);
  --outbound:#6EE7C8; --outbound-soft:rgba(110,231,200,.12);
  --alert:#FF7468; --alert-soft:rgba(255,116,104,.13);
  --series-2:#A9B8D6;
  --r-panel:14px; --r-card:10px;
  --f-display:"Chakra Petch",system-ui,sans-serif;
  --f-body:"Geist",system-ui,sans-serif;
  --f-mono:"Geist Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(1200px 700px at 50% 50%,#0C1630 0%,transparent 62%),var(--bg);color:var(--text);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--outbound);outline-offset:2px;border-radius:999px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.app{display:grid;grid-template-rows:64px minmax(0,1fr);height:100dvh}
header.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(6,10,18,.78);backdrop-filter:blur(10px);position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--text);position:relative;flex:none}
.mark::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--outbound)}
.brand b{font:700 17px/1 var(--f-display);letter-spacing:.04em}
.mode{display:flex;padding:3px;border:1px solid var(--line-2);border-radius:999px;margin-left:8px}
.mode button{height:26px;padding:0 11px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.mode button[aria-pressed="true"][data-mode="live"] i{color:var(--outbound)}
.mode button[aria-pressed="true"][data-mode="demo"] i{color:var(--inbound)}
.tabs{justify-self:center;position:relative;display:flex;gap:2px;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(10,16,28,.6);overflow-x:auto;max-width:100%;scrollbar-width:none}
.tab{position:relative;z-index:1;height:34px;padding:0 13px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px;white-space:nowrap;transition:color .2s var(--ease)}
.tab i{font-size:16px}
.tab:hover,.tab[aria-selected="true"]{color:var(--text)}
.tab .tb{font:500 10.5px/16px var(--f-mono);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--outbound);color:#05211A;text-align:center}
.tab .tb.alert{background:var(--alert);color:#2A0B08}
.tab-ind{position:absolute;top:4px;bottom:4px;left:0;width:0;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);transition:transform .36s var(--ease),width .36s var(--ease)}
.controls{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0}
.day{font:500 12px var(--f-mono);color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.day strong{color:var(--text);font-weight:500}
.daynav{display:flex;align-items:center;gap:0;padding:2px;border:1px solid var(--line);border-radius:999px}
.busy{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--inbound);white-space:nowrap}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--inbound-soft);border-top-color:var(--inbound);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid transparent;transition:background .2s var(--ease),transform .15s var(--ease),border-color .2s}
.btn:active{transform:scale(.97)}
.btn i{font-size:16px}
.btn-ghost:hover{background:var(--surface-2)}
.btn-line{border-color:var(--line-2)}
.btn-line:hover{border-color:var(--muted)}
.btn-primary{background:var(--outbound);color:#05211A;font-weight:600}
.btn-primary:hover{background:#8af0d6}
.btn-amber{background:var(--inbound);color:#2A1802;font-weight:600}
.btn-alert{color:var(--alert)}
.btn-alert:hover{background:var(--alert-soft)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.icon-btn{width:32px;height:32px;border-radius:999px;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s;flex:none}
.icon-btn:hover:not([disabled]){background:var(--surface-2);color:var(--text)}
.icon-btn[disabled]{opacity:.3;cursor:not-allowed}
.icon-btn.sm{width:26px;height:26px}
.link{color:var(--outbound);font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:5px}
.link:hover{text-decoration:underline;text-underline-offset:3px}

/* settings popover */
.pop{position:absolute;right:16px;top:58px;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-panel);padding:18px;z-index:40;box-shadow:0 30px 60px rgba(2,5,12,.6);display:flex;flex-direction:column;gap:12px}
.pop h3{font:600 15px var(--f-display)}
.pop p{font-size:12.5px;color:var(--muted)}
.keystate{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:var(--r-card);background:var(--bg-2)}
.keystate i{font-size:18px;margin-top:1px}
.keystate.ok i{color:var(--outbound)} .keystate.no i{color:var(--alert)}

/* ---------- views ---------- */
.views{min-height:0;position:relative}
.view{display:none;height:100%;min-height:0}
.view.on{display:block;animation:viewIn .34s var(--ease)}
.view.ov.on{display:grid}
@keyframes viewIn{from{opacity:0;transform:translateY(6px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.page{overflow:auto}
.wrap{max-width:1320px;margin:0 auto;padding:30px 32px 64px}
.page-head{margin-bottom:24px;max-width:76ch;display:flex;flex-direction:column;gap:8px}
.page-head h1{font:600 30px/1.1 var(--f-display)}
.page-head p{color:var(--muted);font-size:14.5px}
h3.sh{font:600 13px var(--f-body);color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line-2);border-radius:var(--r-card)}
.card{border:1px solid var(--line);border-radius:var(--r-panel);background:rgba(14,21,37,.65);padding:20px}
.notice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-panel);border:1px solid rgba(243,167,59,.35);background:var(--inbound-soft);font-size:13.5px;margin-bottom:20px}
.notice i{font-size:18px;color:var(--inbound);margin-top:1px}
.notice code,.onboard code,.keystate code,.help code{font-family:var(--f-mono);font-size:12px;background:var(--bg-2);padding:1px 6px;border-radius:6px}
.notice.err{border-color:rgba(255,116,104,.45);background:var(--alert-soft)} .notice.err i{color:var(--alert)}

/* ---------- overview ---------- */
.ov{grid-template-columns:300px minmax(0,1fr) 430px}
.rail{border-right:1px solid var(--line);overflow:auto;padding:24px 22px;display:flex;flex-direction:column;gap:26px}
.mission-k{font-size:12px;color:var(--muted);margin-bottom:8px}
.mission{font:600 20px/1.25 var(--f-display)}
.story{font-size:13.5px;line-height:1.45;padding:12px 14px;border-radius:var(--r-card);border-left:2px solid var(--inbound);background:var(--surface)}
.story small{display:block;color:var(--muted);font:500 11px var(--f-mono);margin-bottom:4px}
.count{font:500 11px var(--f-mono);color:var(--bg);background:var(--alert);border-radius:999px;padding:1px 7px}
.count.calm{background:var(--surface-2);color:var(--muted)}
.goals{display:flex;flex-direction:column;gap:14px}
.goal{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.goal .g{font-size:13px;line-height:1.35}
.goal .n{font:500 12px var(--f-mono);color:var(--muted)}
.gbar{grid-column:1/-1;height:4px;border-radius:2px;background:rgba(148,170,210,.14);overflow:hidden}
.gbar span{display:block;height:100%;background:var(--outbound);transition:width .6s var(--ease)}
.attn{display:flex;flex-direction:column;gap:6px}
.attn button{text-align:left;display:grid;grid-template-columns:18px 1fr;gap:10px;padding:10px 12px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.4;transition:border-color .2s,background .2s}
.attn button:hover{border-color:var(--line-2);background:var(--surface-2)}
.attn i{font-size:16px;margin-top:1px}
.attn .k-alert i{color:var(--alert)} .attn .k-in i{color:var(--inbound)} .attn .k-out i{color:var(--outbound)}
.attn small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.steps{list-style:none;display:flex;flex-direction:column;gap:4px}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--muted);padding:6px 0}
.steps li i{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line-2);font-size:13px}
.steps li.done{color:var(--text)} .steps li.done i{border-color:var(--outbound);color:var(--outbound);background:var(--outbound-soft)}
.steps li.now{color:var(--text)} .steps li.now i{border-color:var(--inbound);color:var(--inbound)}

.stage{position:relative;min-height:0;overflow:hidden;cursor:grab;touch-action:pan-y}
.stage.drag{cursor:grabbing}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:7px;z-index:5;border-radius:16px;padding:4px;cursor:pointer}
.ring{--p:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;background:conic-gradient(var(--outbound) calc(var(--p)*1turn),rgba(148,170,210,.18) 0);transition:transform .3s var(--ease),box-shadow .3s}
.ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--bg-2)}
.ring>span{position:relative;font:600 15px var(--f-display);letter-spacing:.04em}
.node:hover .ring{transform:scale(1.06)}
.node.sel .ring{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.node .nm{font-size:12.5px;font-weight:500;line-height:1.2;text-align:center;white-space:nowrap;text-shadow:0 1px 8px var(--bg)}
.node .rl{display:block;color:var(--muted);font-size:11.5px;font-weight:400;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-2px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:var(--alert);color:#2A0B08;font:600 11px/15px var(--f-mono);text-align:center;border:2px solid var(--bg);font-style:normal}
.badge.out{background:var(--outbound);color:#05211A}
.badge.in{background:var(--inbound);color:#2A1802}
.core-btn{position:absolute;transform:translate(-50%,-50%);border-radius:50%;z-index:4;cursor:pointer}
.core-label{position:absolute;transform:translate(-50%,0);z-index:4;pointer-events:none;font:600 11px var(--f-display);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;white-space:nowrap}
.st-top{position:absolute;left:20px;right:20px;top:18px;display:flex;justify-content:space-between;align-items:center;z-index:6;pointer-events:none}
.st-top>*{pointer-events:auto}
.cycle-chip{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(110,231,200,.3);background:rgba(10,16,28,.7);font-size:12px;color:var(--text)}
.cycle-chip i{color:var(--outbound);font-size:15px}
.cycle-chip:hover{border-color:var(--outbound)}
.hint{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px}
.legend{position:absolute;left:20px;bottom:18px;display:flex;gap:18px;font-size:12px;color:var(--muted);z-index:6;pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:18px;height:2px;border-radius:2px;display:block}
.ticker{position:absolute;right:20px;bottom:18px;font:500 12px var(--f-mono);color:var(--muted);z-index:6;pointer-events:none;max-width:45%;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker b{color:var(--inbound);font-weight:500}
.nogl{position:absolute;inset:auto 0 50% 0;text-align:center;color:var(--muted);font-size:13px}
.onboard{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:7;width:min(420px,calc(100% - 32px));padding:22px;border-radius:var(--r-panel);border:1px solid var(--line-2);background:rgba(10,16,28,.88);backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:12px;text-align:left}
.onboard h2{font:600 22px var(--f-display)}
.onboard p{color:var(--muted);font-size:13.5px}

.panel{border-left:1px solid var(--line);overflow:auto;background:rgba(10,16,28,.6)}
.panel-in{padding:22px 22px 40px;display:flex;flex-direction:column;gap:22px;animation:panelIn .32s var(--ease)}
.panel-in.still,.panel-in.still .task{animation:none}
@keyframes panelIn{from{opacity:0;transform:translateX(10px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.p-head{display:flex;align-items:center;gap:14px}
.p-head .ring{width:56px;height:56px}
.p-head .ring>span{font-size:16px}
.p-head h2{font:600 22px/1.15 var(--f-display)}
.p-head p{color:var(--muted);font-size:13px}
.p-head .grow{flex:1;min-width:0}
.core-glyph{width:56px;height:56px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;background:radial-gradient(circle,var(--outbound-soft),transparent 70%)}
.core-glyph i{font-size:26px;color:var(--outbound)}
.planbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-panel);background:var(--surface)}
.planbar .st{font-size:13px;line-height:1.35}
.planbar .st small{display:block;color:var(--muted);font-size:12px}
.planbar.ok{border-color:rgba(110,231,200,.35)}
.planbar.rev{border-color:rgba(243,167,59,.4)}
.cap{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--muted)}
.agent-note{font-size:13.5px;line-height:1.5;padding:12px 14px;border-radius:var(--r-card);background:var(--surface-2);border-top-left-radius:4px}
.agent-note small{display:block;font:500 11px var(--f-mono);color:var(--outbound);margin-bottom:4px}
.quote{font-size:13.5px;line-height:1.5;padding:12px 14px;border-radius:var(--r-card);background:var(--text);color:var(--bg);border-top-right-radius:4px;margin-left:24px}

.prio{display:flex;flex-direction:column;gap:10px;list-style:none}
.task{border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);padding:13px 14px 12px;display:grid;grid-template-columns:30px 1fr auto;gap:4px 10px;transition:border-color .25s,background .25s;animation:panelIn .36s var(--ease) both}
.task:nth-child(2){animation-delay:.04s}.task:nth-child(3){animation-delay:.08s}
.task.moved{border-color:rgba(243,167,59,.45);background:linear-gradient(180deg,var(--inbound-soft),var(--surface) 70%)}
.task.ghost{border-style:dashed;background:transparent;color:var(--muted)}
.rank{font:600 17px/1.2 var(--f-display);color:var(--muted);display:flex;align-items:center;gap:6px}
.kd{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--outbound);flex:none}
.kd.dec{border-radius:2px;transform:rotate(45deg) scale(.86)}
.t-title{font-size:14px;font-weight:500;line-height:1.35}
.t-title .own{color:var(--faint);font-weight:400}
.t-hours{font:500 12px var(--f-mono);color:var(--muted);padding-top:2px}
.t-meta{grid-column:2/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:5px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.s-ok{color:var(--outbound);background:var(--outbound-soft);border-color:transparent}
.chip.s-wait{color:var(--inbound);border-color:rgba(243,167,59,.4)}
.chip.s-alert{color:var(--alert);border-color:rgba(255,116,104,.45)}
.chip.src{color:var(--inbound);border-color:rgba(243,167,59,.3);cursor:help}
.chip.lid{color:var(--outbound);border-color:rgba(110,231,200,.35);font-family:var(--f-mono)}
.chip.g{border-color:transparent;background:var(--surface-2)}
.t-actions{grid-column:1/-1;display:flex;align-items:center;gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.t-actions .grow{flex:1}
.why{grid-column:1/-1;margin-top:8px;padding:12px;border-radius:var(--r-card);background:var(--bg-2);font-size:13px;display:flex;flex-direction:column;gap:10px;animation:panelIn .25s var(--ease)}
.why .k{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.opts{display:flex;flex-direction:column;gap:2px;max-height:240px;overflow:auto;margin-top:6px}
.opt{display:flex;gap:10px;align-items:baseline;text-align:left;padding:7px 10px;border-radius:8px;font-size:13px}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt[disabled]{color:var(--faint);cursor:default}
.opt b{color:var(--outbound);font-weight:600}
.opt small{color:var(--faint)}
.correct label{display:block;font-size:13px;font-weight:500;margin-bottom:6px}
textarea,input[type=text],input[type=date],input[type=time],input[type=number],input[type=password],select{width:100%;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line-2);padding:9px 11px;font-size:13px;line-height:1.4}
textarea{min-height:72px;resize:vertical}
textarea::placeholder,input::placeholder{color:#6F7B92}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--outbound)}
.help{font-size:12px;color:var(--muted);margin:6px 0 10px}
.err{color:var(--alert)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface)}
.stat b{display:block;font:600 22px/1.1 var(--f-display)}
.stat small{color:var(--muted);font-size:11.5px;line-height:1.3;display:block;margin-top:4px}
.learncard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px;border-radius:var(--r-panel);border:1px solid rgba(110,231,200,.28);background:linear-gradient(135deg,var(--outbound-soft),transparent 70%)}
.learncard p{font-size:13.5px;font-weight:500}
.learncard small{display:block;color:var(--muted);font-size:12px}
.log{list-style:none;display:flex;flex-direction:column}
.log li{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:9px 0;font-size:13px;line-height:1.4;border-top:1px solid var(--line)}
.log li:first-child{border-top:0}
.log .d{font:500 11px var(--f-mono);color:var(--faint);padding-top:2px}
.log .k-in::before,.log .k-out::before,.log .k-alert::before,.log .k-learn::before{content:"";display:inline-block;width:10px;height:2px;margin-right:8px;vertical-align:middle}
.log .k-in::before{background:var(--inbound)} .log .k-out::before{background:var(--outbound)} .log .k-alert::before{background:var(--alert)}
.log .k-learn::before{background:linear-gradient(90deg,var(--inbound),var(--outbound))}
.log small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.bitems{list-style:none;display:flex;flex-direction:column;gap:6px}
.bitems li{font-size:13px;padding:10px 12px;border-radius:var(--r-card);background:var(--surface);border-left:2px solid var(--series-2)}
.bitems li.t-blocker,.bitems li.t-risk{border-left-color:var(--alert)}
.bitems li.t-decision,.bitems li.t-commitment{border-left-color:var(--outbound)}
.bitems li.t-request{border-left-color:var(--inbound)}
.bitems .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.tl{font:600 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.thread{display:flex;flex-direction:column;gap:8px}
.thread .dd{font:500 11px var(--f-mono);color:var(--faint);margin-top:8px}
.thread .ev{font-size:12px;color:var(--outbound);text-align:right}
.learned{font-size:13px;padding:10px 12px;border-radius:var(--r-card);background:var(--outbound-soft)}
.learned ins,.rules ins{text-decoration:none;background:var(--outbound-soft);color:var(--outbound);border-radius:3px;padding:0 2px}
.learned del,.rules del{color:var(--faint)}

/* ---------- team plans ---------- */
.hrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;margin-bottom:26px}
.hcard{scroll-snap-align:start;flex:0 0 280px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-card);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.hcard .pair{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.mini{width:30px;height:30px}
.mini>span{font-size:11px}
.hcard p{font-size:13px;line-height:1.35}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.mcard{border:1px solid var(--line);border-radius:var(--r-panel);background:rgba(14,21,37,.7);padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s}
.mcard:hover{border-color:var(--line-2)}
.mcard .hd{display:flex;align-items:center;gap:12px}
.mcard .hd .ring{width:42px;height:42px}
.mcard .hd .ring>span{font-size:13px}
.mcard h4{font:600 16px/1.2 var(--f-display)}
.mcard .hd small{color:var(--muted);font-size:12px}
.mcard .hd .grow{flex:1;min-width:0}
.ctask{list-style:none;display:grid;grid-template-columns:18px 1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.ctask .r{font:600 13px/1.4 var(--f-display);color:var(--muted)}
.ctask .tt{font-size:13px;line-height:1.4}
.ctask .h{font:500 11.5px var(--f-mono);color:var(--muted)}
.ctask.moved .tt{color:var(--inbound)}
.mcard .reason{font-size:12.5px;color:var(--muted);font-style:italic}
.mcard .ft{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:4px;font-size:12px;color:var(--muted)}

/* ---------- learning ---------- */
.learn-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
.spiral-wrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:center}
.spiral svg{width:100%;height:auto;display:block}
.stages{list-style:none;display:flex;flex-direction:column;gap:4px}
.stages li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:var(--r-card);transition:background .3s var(--ease),color .3s;color:var(--muted)}
.stages li i{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;border:1px solid var(--line-2);font-size:14px;transition:all .3s var(--ease)}
.stages li b{display:block;font-size:13px;font-weight:500}
.stages li small{font-size:11.5px}
.stages li.on{background:var(--outbound-soft);color:var(--text)}
.stages li.on i{border-color:var(--outbound);color:var(--outbound);background:rgba(110,231,200,.08)}
.stages li.feed.on{background:var(--inbound-soft)}
.stages li.feed.on i{border-color:var(--inbound);color:var(--inbound)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.chart svg{width:100%;height:auto;display:block}
.chart .lg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.chart .lg span{display:flex;align-items:center;gap:6px}
.chart .lg i{width:14px;height:0;display:block;border-top:2px solid}
.rules{list-style:none;display:flex;flex-direction:column;gap:6px}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:10px 12px;border-radius:var(--r-card);background:var(--surface);border:1px solid var(--line);font-size:13px;line-height:1.45}
.rules li small{display:block;color:var(--muted);font-size:11.5px;margin-top:3px}
.rules li.fresh{border-color:rgba(110,231,200,.45);animation:fresh 1.2s var(--ease)}
.rules li.flag{border-color:rgba(255,116,104,.4)}
@keyframes fresh{from{background:rgba(110,231,200,.18)}to{background:var(--surface)}}
.note{display:flex;gap:10px;font-size:12.5px;color:var(--muted);line-height:1.5;padding:12px 14px;border-radius:var(--r-card);border:1px solid var(--line);margin-top:16px}
.note i{font-size:16px;color:var(--outbound);margin-top:1px}
.seg{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:12px}
.seg button{padding:0 0 8px;margin-bottom:-1px;font-weight:500;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.seg button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--outbound)}

/* ---------- tables / forms ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:flex;flex-direction:column;gap:20px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{font-weight:500;color:var(--muted);text-align:left;font-size:12px;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t .n{font-family:var(--f-mono);text-align:right}
.akind{display:inline-flex;align-items:center;gap:6px;font-weight:500;white-space:nowrap}
.akind.alert{color:var(--alert)} .akind.in{color:var(--inbound)} .akind.out{color:var(--outbound)}
.feed{list-style:none;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:10px 0;font-size:13px;line-height:1.45;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0}
.feed li>i{width:28px;height:28px;border-radius:999px;display:grid;place-items:center;background:var(--inbound-soft);color:var(--inbound);font-size:14px}
.feed small{color:var(--muted);display:block;font-size:11.5px}
.feed .body{white-space:pre-line}
.feed details summary{cursor:pointer;color:var(--muted);font-size:12px;margin-top:4px}
.feed details p{white-space:pre-line;margin-top:6px;color:var(--text);font-size:12.5px;padding:10px;border-radius:var(--r-card);background:var(--bg-2)}
.form{display:flex;flex-direction:column;gap:12px}
.row{display:grid;gap:10px}
.r2{grid-template-columns:1fr 1fr} .r3{grid-template-columns:1fr 1fr 1fr} .r4{grid-template-columns:repeat(4,1fr)}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted);min-width:0}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--text);cursor:pointer}
.checks input{accent-color:var(--outbound)}
.kindseg{display:flex;padding:3px;border:1px solid var(--line-2);border-radius:999px;width:max-content;max-width:100%}
.kindseg button{height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kindseg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text)}
.lrow{display:grid;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.sec{display:flex;flex-direction:column;gap:6px}
.sec+.sec{margin-top:24px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h3{font:600 16px var(--f-display)}
.sec-h small{color:var(--muted);font-size:12.5px}
.savebar{position:sticky;bottom:-20px;display:flex;gap:10px;align-items:center;justify-content:flex-end;padding:16px 0 4px;margin-top:20px;background:linear-gradient(transparent,rgba(14,21,37,.98) 30%)}
.ro{font-size:13.5px}
.ro dt{color:var(--muted);font-size:12px;margin-top:12px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;z-index:50;background:var(--surface-2);border:1px solid var(--line-2);border-radius:999px;padding:10px 18px;font-size:13px;display:flex;gap:10px;align-items:center;transition:all .35s var(--ease);pointer-events:none;box-shadow:0 20px 50px rgba(2,5,12,.6);max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast i{color:var(--outbound);font-size:16px}
.toast.bad i{color:var(--alert)}

/* ---------- responsive ---------- */
@media (max-width:1440px){ .tab .lbl{display:none} .tab{padding:0 11px} .tab[aria-selected="true"] .lbl{display:inline} }
@media (max-width:1180px){
  .ov{grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:minmax(0,1fr) 240px;grid-template-areas:"stage panel" "rail panel"}
  .stage{grid-area:stage} .panel{grid-area:panel}
  .rail{grid-area:rail;border-right:0;border-top:1px solid var(--line);flex-direction:row;gap:24px}
  .rail>section{flex:1;min-width:0}
  .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  .learn-grid,.two{grid-template-columns:1fr}
  .lrow{grid-template-columns:1fr 1fr!important}
}
@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;grid-template-rows:auto auto}
  header.top{grid-template-columns:1fr;padding:10px 16px;gap:10px}
  .tabs{justify-self:stretch;justify-content:flex-start}
  .controls{justify-content:flex-start;flex-wrap:wrap}
  .view.ov.on{display:flex;flex-direction:column}
  .stage{height:min(110vw,540px);flex:none;order:1}
  .panel{order:2;border-left:0;border-top:1px solid var(--line);overflow:visible}
  .rail{order:3;flex-direction:column;border-top:1px solid var(--line);padding:20px 16px}
  .panel-in{padding:20px 16px 32px}
  .page{overflow:visible}
  .wrap{padding:22px 16px 48px}
  .board{grid-template-columns:1fr}
  .spiral-wrap{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .r3,.r4{grid-template-columns:1fr 1fr}
  .lrow{grid-template-columns:1fr!important}
  .node .rl{display:none}
  .node .ring{width:42px;height:42px}
  .node .ring>span{font-size:13px}
  .ticker,.hint{display:none}
  .legend{left:16px;bottom:12px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"></span><b>WORKFLOWGPS</b>
      <div class="mode" role="group" aria-label="Mode">
        <button data-mode="live" aria-pressed="true" title="Your team's workspace"><i class="ph-fill ph-circle"></i>Live</button>
        <button data-mode="demo" aria-pressed="false" title="Replay the Tidewell demo run"><i class="ph ph-play-circle"></i>Demo</button>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Views" id="tabs">
      <span class="tab-ind" id="tabInd" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="overview" id="t-overview"><i class="ph ph-circles-three-plus"></i><span class="lbl">Overview</span></button>
      <button class="tab" role="tab" data-tab="inbox" id="t-inbox"><i class="ph ph-tray-arrow-down"></i><span class="lbl">Inbox</span><span class="tb" id="tbInbox" hidden></span></button>
      <button class="tab" role="tab" data-tab="plans" id="t-plans"><i class="ph ph-users-three"></i><span class="lbl">Team plans</span><span class="tb alert" id="tbPlans" hidden></span></button>
      <button class="tab" role="tab" data-tab="learning" id="t-learning"><i class="ph ph-arrows-clockwise"></i><span class="lbl">Learning</span><span class="tb" id="tbLearn" hidden></span></button>
      <button class="tab" role="tab" data-tab="health" id="t-health"><i class="ph ph-heartbeat"></i><span class="lbl">Health</span><span class="tb alert" id="tbHealth" hidden></span></button>
      <button class="tab" role="tab" data-tab="activity" id="t-activity"><i class="ph ph-pulse"></i><span class="lbl">Activity</span></button>
      <button class="tab" role="tab" data-tab="teach" id="t-teach"><i class="ph ph-chalkboard-teacher"></i><span class="lbl">Teach</span></button>
      <button class="tab" role="tab" data-tab="setup" id="t-setup"><i class="ph ph-gear-six"></i><span class="lbl">Setup</span></button>
    </nav>
    <div class="controls" id="controls"></div>
  </header>
  <div class="pop" id="settings" hidden></div>

  <main class="views">
    <section class="view ov" id="v-overview" role="tabpanel" aria-labelledby="t-overview">
      <aside class="rail" id="rail" aria-label="Team overview"></aside>
      <section class="stage" id="stage" aria-label="3D team brain">
        <canvas id="cv" aria-hidden="true"></canvas>
        <div class="st-top">
          <button class="cycle-chip" data-tab="learning" id="cycleChip"></button>
          <span class="hint"><i class="ph ph-hand-grabbing"></i>Drag to rotate</span>
        </div>
        <button class="core-btn" id="coreBtn" data-sel="brain" aria-label="Open the shared brain"></button>
        <div class="core-label" id="coreLabel">Shared brain</div>
        <div id="nodes"></div>
        <div id="onboard"></div>
        <div class="legend" aria-hidden="true">
          <span><i style="background:var(--inbound)"></i>Context in</span>
          <span><i style="background:var(--outbound)"></i>Direction out</span>
        </div>
        <div class="ticker" id="ticker"><b id="sig">0</b> signals</div>
      </section>
      <aside class="panel" id="panel" aria-label="Detail view"></aside>
    </section>
    <section class="view page" id="v-inbox" role="tabpanel"></section>
    <section class="view page" id="v-plans" role="tabpanel"></section>
    <section class="view page" id="v-learning" role="tabpanel"></section>
    <section class="view page" id="v-health" role="tabpanel"></section>
    <section class="view page" id="v-activity" role="tabpanel"></section>
    <section class="view page" id="v-teach" role="tabpanel"></section>
    <section class="view page" id="v-setup" role="tabpanel"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><i class="ph ph-check-circle"></i><span></span></div>

<script src="demo.js"></script>
<script>
/* =========================================================
   STATE
   Both modes render from the same shape (agent/view.py):
   {company, people, tickets, customers, oncall, events, lesson_health,
    days:[{day,date,story,inputs,sources,brain,plans,score,open,lessons_after,lesson_changes,health,calls}]}
   Live adds {live, setup_raw}; Demo adds {compare} and per-day {nolearn}.
   ========================================================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const DEMO=window.DEMO_DATA||null;
const params=new URLSearchParams(location.search);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const ANG=[-90,-30,30,90,150,-150];
const TYPE_NAME={decision:'Decision',commitment:'Commitment',blocker:'Blocker',request:'Request',risk:'Risk',status:'Status'};
const TYPE_ICON={decision:'ph-gavel',commitment:'ph-handshake',blocker:'ph-warning-octagon',request:'ph-hand',risk:'ph-siren',status:'ph-info'};
const SRC_ICON={meeting:'ph-users-three',slack:'ph-chat-circle-text',jira:'ph-ticket',ticket:'ph-ticket'};
const ALERT_META={repaired:['ph-wrench','in','Output repaired'],rejected_plan:['ph-x-circle','alert','Plan rejected'],regression:['ph-trend-down','alert','Agreement dropped'],lesson_overridden:['ph-arrow-u-up-left','in','Rule overridden']};
const SLACK=['#general','#eng','#design','#customers'];

const APP={
  mode:(params.get('mode')||store.get('wgps-mode')||'live')==='demo'?'demo':'live',
  tab:params.get('tab')||'overview', live:null, cfg:null, online:null,
  idx:0, sel:'brain', key:'', busy:null, revealed:true, playing:false, settings:false,
  drafts:{}, open:{}, showAll:{}, inboxKind:'meeting', jiraAction:'create', setupDraft:null, setupErr:'',
  teach:{i:1,person:null,slots:[],touched:false,reason:'',result:null,busy:false,showAll:false,status:'',err:false},
  allAttn:false, learnView:'rules', signals:0,
};
if(!DEMO&&APP.mode==='demo')APP.mode='live';

const data=()=>APP.mode==='demo'?DEMO:(APP.live&&APP.live.setup?APP.live:null);
const day=()=>{const D=data();return D&&D.days.length?D.days[Math.min(APP.idx,D.days.length-1)]:null};
const isLive=()=>APP.mode==='live';
const isToday=()=>isLive()&&!!data()&&APP.idx===data().days.length-1;
const shownNow=()=>APP.mode!=='demo'||APP.revealed;
const PERSON=id=>{const D=data();return D?D.people.find(p=>p.id===id):null};
const first=id=>{const p=PERSON(id);return p?p.first:id};
const initials=n=>n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join('');
function members(){
  const D=data();
  if(D)return D.people.map((p,i)=>({...p,ini:initials(p.name),ang:ANG[i%6]}));
  return ANG.map((a,i)=>({id:'slot'+i,name:'Teammate '+(i+1),first:'Teammate '+(i+1),role:'Add in Setup',ini:'?',ang:a}));
}
const T=id=>{const D=data();return (D&&D.tickets[id])||{title:id,owner:null,kind:'action',goal:null}};
const fmtH=h=>h==null||h===''?'':`${+h}h`;
const pct=v=>v==null?'–':Math.round(v)+'%';
function lessonsBefore(i){const D=data();if(!D)return[];for(let k=i-1;k>=0;k--){if(D.days[k].lessons_after)return D.days[k].lessons_after;}return[];}
function lessonsNow(){const d=day();if(!d)return[];return d.lessons_after&&shownNow()?d.lessons_after:lessonsBefore(APP.idx);}
function planOf(pid){const d=day();return d&&d.plans?d.plans[pid]:null;}
function fbOf(pid){const p=planOf(pid);if(!p||!p.feedback||!shownNow())return null;return p.feedback;}
function ownerAt(tid){const d=day();const o=d&&d.open.find(x=>x.id===tid);return o?o.owner:T(tid).owner;}
function goalName(g){const D=data();const x=D&&D.company.goals.find(z=>z.id===g);return x?x.goal:'Other work';}
function closedDays(){const D=data();if(!D)return[];return D.days.slice(0,APP.idx+1).filter((d,i)=>d.lessons_after&&(i<APP.idx||shownNow()));}
function srcInfo(id){
  if(/^TW-\d+$/.test(id))return{kind:'ticket',label:id,text:T(id).title};
  const m=/^D(\d+)-/.exec(id), D=data();
  const s=m&&D&&D.days[+m[1]-1]&&D.days[+m[1]-1].sources[id];
  if(!s)return{kind:'jira',label:id,text:id};
  const label=s.kind==='meeting'?s.label:s.kind==='slack'?`${s.label} · ${first(s.who)}`:s.label;
  return{kind:s.kind,label,text:(s.kind==='meeting'?s.label+'\n':'')+s.text,who:s.who};
}
const srcChip=id=>{const s=srcInfo(id);return `<span class="chip src" title="${esc(id+': '+s.text)}"><i class="ph ${SRC_ICON[s.kind]||'ph-file'}"></i>${esc(s.label)}</span>`};
const kd=id=>`<span class="kd ${T(id).kind==='decision'?'dec':''}" title="${T(id).kind==='decision'?'Decision others wait on':'Action'}"></span>`;
const ownTag=(tid,pid)=>{const o=ownerAt(tid);return o&&o!==pid&&PERSON(o)?` <span class="own">(${esc(first(o))}'s)</span>`:''};
function ring(id,cls=''){const m=members().find(x=>x.id===id)||{ini:'?'};return `<span class="ring ${cls}" style="--p:${progressOf(id)}"><span>${esc(m.ini)}</span></span>`;}
function progressOf(pid){const p=planOf(pid),f=fbOf(pid);if(!p||!f)return 0;return p.score!=null?p.score/100:(f.action==='accept'?1:.5);}
function diffWords(a,b){
  const x=a.split(/\s+/),y=b.split(/\s+/),m=x.length,n=y.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=x[i]===y[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<m&&j<n){if(x[i]===y[j]){out.push(esc(y[j]));i++;j++;}else if(L[i+1][j]>=L[i][j+1]){out.push(`<del>${esc(x[i])}</del>`);i++;}else{out.push(`<ins>${esc(y[j])}</ins>`);j++;}}
  while(i<m)out.push(`<del>${esc(x[i++])}</del>`);while(j<n)out.push(`<ins>${esc(y[j++])}</ins>`);

   API
   ========================================================= */
async function api(path,body){
  const headers={'content-type':'application/json'};
  if(APP.key)headers['X-LLM-Key']=APP.key;
  const r=await fetch(path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||`The server answered ${r.status}.`),{status:r.status});
  return j;
}
async function boot(){
  try{APP.cfg=await api('/api/config');APP.online=true;}catch(e){APP.online=false;}
  if(APP.online&&APP.cfg.workspace){try{setLive(await api('/api/workspace'),true);}catch(e){toast(e.message,true);}}
  afterData(true);
}
function setLive(snap,jump){
  const prevDays=APP.live&&APP.live.days?APP.live.days.length:0;
  APP.live=snap;
  if(isLive()&&snap.setup&&(jump||snap.days.length!==prevDays))APP.idx=snap.days.length-1;
}
async function liveAction(path,body,label,ok){
  if(APP.busy)throw new Error('busy');
  APP.busy={label,t0:performance.now()};renderKeep();
  const tick=setInterval(renderBusy,500);
  try{
    const snap=await api(path,body===undefined?{}:body);
    const before=APP.live; setLive(snap,/close-day|setup|import/.test(path));
    APP.busy=null; clearInterval(tick);
    afterData(false,before);
    if(ok)toast(typeof ok==='function'?ok(snap):ok);
    return snap;
  }catch(e){
    APP.busy=null; clearInterval(tick); renderKeep();
    toast(e.message,true);
    if(e.status===401)openSettings();
    throw e;
  }
}

    const f=p.feedback;
    if(f&&f.action==='edit')parts.push(`<div class="quote">${esc(f.reason)}</div>`);
    else if(f&&f.action==='accept')parts.push(`<p class="ev"><i class="ph ph-check"></i> ${esc(first(pid))} accepted</p>`);
    d.lesson_changes.filter(c=>c.from.includes(pid)).forEach(c=>parts.push(`<div class="learned"><span class="chip lid">${esc(c.id)}</span> ${c.kind==='revised'&&c.before?diffWords(c.before,c.rule):esc(c.rule)}</div>`));
  }
  const today=day();
  if(shownNow()&&today)today.lesson_changes.filter(c=>c.from.includes(pid)).forEach(c=>parts.push(`<p class="dd">TODAY</p><div class="learned"><span class="chip lid">${esc(c.id)}</span> ${c.kind==='revised'&&c.before?diffWords(c.before,c.rule):esc(c.rule)}</div>`));
  if(!parts.length)return '';
  return `<section><h3 class="sh"><i class="ph ph-chats-circle"></i>Earlier with the agent</h3><div class="thread">${parts.join('')}</div></section>`;
}

        <div class="meta">${it.person&&PERSON(it.person)?`<button class="chip" data-sel="${esc(it.person)}">${esc(first(it.person))}</button>`:''}${it.ticket?`<span class="chip" title="${esc(T(it.ticket).title)}">${esc(it.ticket)}</span>`:''}${it.sources.map(srcChip).join('')}</div></li>`).join('')}</ul></section>`;
  }

const STAGES=[

  {icon:'ph-graph',name:'Interpret',sub:d=>d.brain?`Brain: ${d.brain.items.length} cited facts`:'Brain not built yet'},

  {icon:'ph-brain',name:'Learn',sub:d=>`${shownNow()?d.lesson_changes.length:0} rule changes · ${lessonsNow().length} rules`},
];
let TURNS=8;const SC=260,R_OUT=226,R_IN=52;
function spiralXY(th){const r=R_OUT-(R_OUT-R_IN)*th/(2*Math.PI*TURNS),a=th-Math.PI/2;return[SC+Math.cos(a)*r,SC+Math.sin(a)*r];}
function spiralPath(a,b){if(b<=a)return'';let d='';for(let th=a;th<=b+1e-6;th+=.04){const[x,y]=spiralXY(Math.min(th,b));d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}return d;}
function renderLearning(){
  const D=data(), d=day();
  if(!D||!d){$('#v-learning').innerHTML=emptyPage('Learning','Every correction becomes a written rule with the name of whoever taught it. Agreement with your team is tracked day by day.');return;}
  const closed=closedDays(); TURNS=Math.max(8,D.days.length);
  const done=closed.length, scored=closed.filter(c=>c.score), last=scored.at(-1), firstS=scored[0];
  const labels=closed.slice(0,TURNS).map((c,i)=>{const[x,y]=spiralXY(2*Math.PI*(i+1));return `<circle cx="${x}" cy="${y}" r="3.5" fill="#6EE7C8"/><text x="${x+9}" y="${y+4}" font-family="Geist Mono" font-size="10.5" fill="#8E9BB2" style="paint-order:stroke;stroke:#0E1525;stroke-width:5px">D${c.day}${c.score?' '+Math.round(c.score.mean)+'%':''}</text>`;}).join('');
  const ticks=STAGES.map((s,k)=>{const[x,y]=spiralXY(2*Math.PI*(done+k/5));return `<circle class="sp-tick" data-k="${k}" cx="${x}" cy="${y}" r="4" fill="var(--bg)" stroke="${k===0?'#F3A73B':'#6EE7C8'}" stroke-opacity=".5" stroke-width="1.5"/>`;}).join('');
  const rules=lessonsNow(), lh=D.lesson_health||{}, demo=APP.mode==='demo';
  let kpis;
  if(demo){
    const C=DEMO.compare, held=k=>{const s=C.series[k];if(!s)return null;const v=[3,4,5,6,7,8].map(n=>s.by_day[n]).filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
    const corr=k=>D.days.slice(1).reduce((a,x)=>{const s=k==='learn'?x.score:x.nolearn;return a+(s?6-s.accepts:0);},0);
    const hl=held(C.learn), hn=held(C.nolearn);
    kpis=[[hl!=null?hl.toFixed(1):'–','agreement on held-out days 3–8, learning on','var(--outbound)'],[hn!=null?hn.toFixed(1):'–','same days, learning off',''],[`${corr('learn')} vs ${corr('nolearn')}`,'corrections needed, days 2–8',''],[rules.length,`rules known on day ${d.day}`,'']];
  } else kpis=[[done,'days closed',''],[rules.length,'rules learned',''],[last?pct(last.score.mean):'–','last day agreement',''],[last&&firstS&&scored.length>1?(last.score.mean-firstS.score.mean>0?'+':'')+Math.round(last.score.mean-firstS.score.mean)+' pts':'–','since the first scored day',last&&firstS&&last.score.mean>firstS.score.mean?'var(--outbound)':'']];
  const changes=[];for(let i=APP.idx;i>=0;i--){if(i===APP.idx&&!shownNow())continue;D.days[i].lesson_changes.forEach(c=>changes.push({...c,day:D.days[i].day,today:i===APP.idx}));}
  const teachers=l=>[...new Set((l.evidence||[]).map(e=>e.split(':')[1]).filter(Boolean))];
  $('#v-learning').innerHTML=`<div class="wrap"><div class="page-head"><h1>Learning loop</h1><p>Each day is one cycle: inputs, then the brain, then three stops each, then people accept or reroute and say why, then the agent writes or revises rules and uses them from the next day on. The model is never retrained. Every rule is written down and shows who taught it.</p></div>
    <div class="learn-grid">
      <section class="card"><div class="spiral-wrap"><div class="spiral"><svg viewBox="0 0 520 520" role="img" aria-label="Learning spiral: ${done} cycles complete">
        <defs><radialGradient id="cg"><stop offset="0" stop-color="#6EE7C8" stop-opacity=".22"/><stop offset="1" stop-color="#6EE7C8" stop-opacity="0"/></radialGradient></defs>
        <circle cx="${SC}" cy="${SC}" r="90" fill="url(#cg)"/>
        <path d="${spiralPath(0,2*Math.PI*TURNS)}" fill="none" stroke="rgba(148,170,210,.16)" stroke-width="1" stroke-dasharray="2 5"/>
        <path d="${spiralPath(0,2*Math.PI*done)}" fill="none" stroke="#6EE7C8" stroke-opacity=".75" stroke-width="2" stroke-linecap="round"/>
        ${labels}${done<TURNS?ticks:''}
        <path id="spTrail" fill="none" stroke="#6EE7C8" stroke-width="3" stroke-linecap="round" opacity=".9"/>
        <circle id="spGlow" r="11" fill="#6EE7C8" opacity=".18"/><circle id="spDot" r="5" fill="#6EE7C8"/>
        <circle cx="${SC}" cy="${SC}" r="40" fill="var(--bg-2)" stroke="rgba(110,231,200,.35)"/>
        <text x="${SC}" y="${SC-2}" text-anchor="middle" font-family="Chakra Petch" font-weight="600" font-size="20" fill="#E6ECF5">${last?Math.round(last.score.mean)+'%':'Day '+d.day}</text>
        <text x="${SC}" y="${SC+15}" text-anchor="middle" font-family="Geist" font-size="9.5" fill="#8E9BB2">${last?'agreement':'in progress'}</text>
      </svg></div>
      <ol class="stages" id="stages">${STAGES.map((s,k)=>`<li class="${k===0?'feed':''}" data-k="${k}"><i class="ph ${s.icon}"></i><span><b>${s.name}</b><small>${esc(s.sub(d))}</small></span></li>`).join('')}</ol></div>
      ${isToday()&&D.live.planned?`<div style="display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)"><button class="btn btn-primary" data-act="close" ${APP.busy?'disabled':''}><i class="ph ph-moon-stars"></i>Close day ${d.day} and learn</button></div>`:''}
      ${demo?`<p class="note"><i class="ph ph-info"></i><span>Tidewell is fictional: 6 people, 8 working days, 58 tickets. Days 1–2 were used for development; prompts were frozen before days 3–8. The same days ran with learning on and off. Each person's real priorities depend on facts no document states.</span></p>`:''}
      </section>
      <section class="card"><div class="kpis">${kpis.map(k=>`<div class="stat"><b class="num" style="${k[2]?'color:'+k[2]:''}">${k[0]}</b><small>${k[1]}</small></div>`).join('')}</div>
        <h3 class="sh">Agreement by day</h3>${chartHTML()}

function chartHTML(){
  const D=data(), W=560,H=220,l=34,r=16,t=12,b=26, n=Math.max(D.days.length,2);
  const x=v=>l+(v-1)/(n-1)*(W-l-r), y=v=>t+(1-v/100)*(H-t-b);
  const upto=APP.idx+(shownNow()?1:0);
  let lines=[], bands='';
  if(APP.mode==='demo'){
    const C=DEMO.compare, cols=[[C.learn,'#6EE7C8',''],[C.nolearn,'#A9B8D6','5 4'],['ranker_online','#F3A73B','2 4']];
    cols.forEach(([k,col,dash])=>{const s=C.series[k];if(s)lines.push({label:s.label,col,dash,pts:Object.entries(s.by_day).map(([dd,v])=>[+dd,v]).filter(p=>p[0]<=upto)});});
    [['learn','#6EE7C8'],['nolearn','#A9B8D6']].forEach(([m,col])=>{const bd=C.bands[m];if(!bd)return;const pts=Object.entries(bd).map(([dd,v])=>[+dd,...v]).filter(p=>p[0]<=upto).sort((a,b)=>a[0]-b[0]);if(pts.length<2)return;
      bands+=`<path d="${pts.map((p,i)=>(i?'L':'M')+x(p[0])+' '+y(p[2])).join('')}${pts.slice().reverse().map(p=>'L'+x(p[0])+' '+y(p[1])).join('')}Z" fill="${col}" opacity=".08"/>`;});
  } else {
    const pts=D.days.slice(0,upto).filter(d=>d.score).map(d=>[d.day,d.score.mean]);
    if(!pts.length)return `<p class="empty">Close your first day to start the trend. Agreement compares each person's final order with the agent's: full credit for the same place, half for a different place, weighted 3, 2, 1.</p>`;
    lines.push({label:'Agreement',col:'#6EE7C8',dash:'',pts});
  }
  const grid=[0,25,50,75,100].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(148,170,210,${v?.08:.18})"/><text x="${l-8}" y="${y(v)+3.5}" text-anchor="end" font-family="Geist Mono" font-size="10" fill="#64718A">${v}</text>`).join('');
  const xl=D.days.map(dd=>`<text x="${x(dd.day)}" y="${H-6}" text-anchor="middle" font-family="Geist Mono" font-size="10" fill="${dd.day===APP.idx+1?'#E6ECF5':'#64718A'}">D${dd.day}</text>`).join('');
  const marker=`<line x1="${x(APP.idx+1)}" x2="${x(APP.idx+1)}" y1="${t}" y2="${H-b}" stroke="rgba(148,170,210,.18)" stroke-dasharray="2 3"/>`;
  const svgLines=lines.map(s=>s.pts.length?`<path d="${s.pts.map((p,i)=>(i?'L':'M')+x(p[0])+' '+y(p[1])).join('')}" fill="none" stroke="${s.col}" stroke-width="2" stroke-dasharray="${s.dash}" stroke-linejoin="round"/>
    ${s.pts.map(p=>`<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.5" fill="${s.col}"><title>Day ${p[0]}: ${esc(s.label)} ${p[1]}</title></circle>`).join('')}`:'').join('');
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Agreement by day">${grid}${marker}${bands}${xl}${svgLines}</svg>
    <div class="lg">${lines.map(s=>`<span><i style="border-color:${s.col};border-top-style:${s.dash?'dashed':'solid'}"></i>${esc(s.label)}</span>`).join('')}${APP.mode==='demo'?'<span>Shaded: range across 3 more runs</span>':''}</div></div>`;
}

async function teach(){
  const TS=APP.teach, dd=DEMO.days[TS.i], next=DEMO.days[TS.i+1], p=PERSON(TS.person);
  TS.busy=true;TS.err=false;const t0=performance.now();

  renderTeach(); brainLearn();
  try{
    const j=await api('/api/teach',{day:dd.day,person:TS.person,final:TS.slots,reason:TS.reason.trim()});
    const before=Object.fromEntries(lessonsBeforeDemo(TS.i).map(l=>[l.id,l.rule]));
    const learned=(j.changed||[]).map(id=>{const l=j.lessons.find(x=>x.id===id);return l?`<li class="fresh"><span class="chip lid">${esc(id)}</span><span>${before[id]?diffWords(before[id],l.rule):esc(l.rule)}<small>${before[id]?'Revised':'New rule'} after ${esc(p.first)}'s answer</small></span></li>`:''}).join('');
    const plans=Object.fromEntries(j.plan.plans.map(x=>[x.person,x])), basep=Object.fromEntries(j.baseline.plans.map(x=>[x.person,x]));
    const ids=x=>x?x.top3.map(i=>i.ticket).join():'';
    const nChanged=DEMO.people.filter(q=>ids(plans[q.id])!==ids(basep[q.id])).length;
    TS.result=`<h3 class="sh">What it learned</h3><ul class="rules" style="margin-bottom:20px">${learned||'<li><span></span><span>No new rule. The answer matched what it already knew.</span></li>'}</ul>
      <h3 class="sh">${esc(next.weekday)}, planned again</h3><p style="font-size:16px;font-weight:500;margin-bottom:4px">${nChanged?`${nChanged} of 6 plans changed compared with the demo run.`:'No plan changed compared with the demo run.'}</p>
      <p class="help">${j.calls} model calls, ${j.cache_hits} from cache, ${Math.round(j.seconds)}s.</p>
      <div class="board" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:10px">${DEMO.people.map(q=>{const pl=plans[q.id],bs=basep[q.id],ch=ids(pl)!==ids(bs),bi=bs?bs.top3.map(i=>i.ticket):[];
        return `<article class="mcard" style="padding:12px;gap:4px;${ch?'border-color:rgba(243,167,59,.45)':''}"><div class="hd"><div class="grow"><h4 style="font-size:14px">${esc(q.first)}</h4><small style="${ch?'color:var(--inbound)':''}">${ch?'Changed':'Same as the demo run'}</small></div></div>
        <ol style="list-style:none">${(pl?pl.top3:[]).map((it,k)=>`<li class="ctask ${ch&&bi[k]!==it.ticket?'moved':''}"><span class="r">${k+1}</span><span class="tt" title="${esc(it.why)}">${esc(T(it.ticket).title)}</span><span class="h">${fmtH(it.hours)}</span></li>`).join('')}</ol></article>`;}).join('')}</div>`;
    TS.status=`Done. ${p.first}'s answer was learned and ${next.weekday} was planned again.`;
    if(j.changed&&j.changed.length)brainLearn();
    toast('Learned and re-planned.');
  }catch(e){TS.err=true;TS.status=e.message;if(e.status===401)openSettings();}
  finally{clearInterval(tick);TS.busy=false;renderTeach();}
}

let timers=[];const later=(fn,ms)=>timers.push(setTimeout(fn,reduce?0:ms));function clearTimers(){timers.forEach(clearTimeout);timers=[];}
function showDay(i){

      if(APP.playing)later(()=>{APP.idx<D.days.length-1?showDay(APP.idx+1):(APP.playing=false,renderKeep());},5200);},1800);

const quiet=()=>{};

let suppressClick=false;
document.addEventListener('click',async e=>{
  if(suppressClick){suppressClick=false;if(e.target.closest('#stage')){e.preventDefault();return;}}
  if(APP.settings&&!e.target.closest('#settings')&&!e.target.closest('[data-act="settings"]')){APP.settings=false;renderSettings();}
  const md=e.target.closest('[data-mode]'); if(md&&!md.disabled){setMode(md.dataset.mode);return;}
  const a=e.target.closest('[data-act]');
  const tb=e.target.closest('[data-tab]'); if(tb&&(!a||tb.contains(a)===false||tb===a)&&!(a&&a!==tb)){setTab(tb.dataset.tab);return;}
  const op=e.target.closest('[data-open]'); if(op){APP.sel=op.dataset.open;setTab('overview');return;}
  const sel=e.target.closest('[data-sel]');
  if(sel&&!a){if(sel.disabled)return;APP.sel=sel.dataset.sel;renderKeep();$('#panel').scrollTop=0;if(APP.sel!=='brain'&&PERSON(APP.sel))pulseOut([APP.sel],1);return;}
  if(!a||a.disabled)return;
  const pid=a.dataset.p, D=data();
  switch(a.dataset.act){
    case 'prev': stopPlay(); showDay(APP.idx-1); return;
    case 'next': stopPlay(); showDay(APP.idx+1); return;
    case 'today': showDay(D.days.length-1); return;
    case 'play': if(APP.playing){APP.playing=false;renderKeep();}else{APP.playing=true;showDay(APP.idx>=D.days.length-1?0:APP.idx+1);} return;
    case 'settings': APP.settings=!APP.settings; renderSettings(); return;
    case 'allattn': APP.allAttn=!APP.allAttn; break;
    case 'why': APP.open[a.dataset.id]=!APP.open[a.dataset.id]; break;
    case 'learnview': APP.learnView=a.dataset.v; break;
    case 'plan':
      if(!isToday()){showDay(D.days.length-1);return;}
      inboundAll();
      liveAction('/api/workspace/plan',{},'Reading inputs and planning…',s=>`Planned day ${s.live.day} for all six people.`).then(()=>{APP.drafts={};renderKeep();}).catch(quiet); return;
    case 'close': {
      const L=D.live, missing=6-L.responded.length;
      if(missing&&!confirm(`${missing} of 6 haven't answered. Close day ${L.day} anyway? Unanswered plans aren't scored.`))return;
      const last=D.days.at(-1), edits=D.people.filter(p=>{const pl=last.plans[p.id];return pl&&pl.feedback&&pl.feedback.action==='edit'}).length;
      liveAction('/api/workspace/close-day',{},edits?'Learning from corrections…':'Closing the day…',s=>{const c=s.days[s.days.length-2].lesson_changes.length;return c?`Learned ${c} rule change${c===1?'':'s'}. Day ${s.live.day} is open.`:`Day closed. Day ${s.live.day} is open.`;}).then(()=>{APP.drafts={};}).catch(quiet); return; }
    case 'mv': {const dr=draftOf(pid),k=+a.dataset.k,j=k+(+a.dataset.d);[dr.slots[k],dr.slots[j]]=[dr.slots[j],dr.slots[k]];pulseIn(pid);break;}
    case 'rm': draftOf(pid).slots.splice(+a.dataset.k,1); break;
    case 'add': {const dr=draftOf(pid);if(dr.slots.length<3)dr.slots.push(a.dataset.t);pulseIn(pid);break;}

  if(!G){for(let i=packets.length-1;i>=0;i--){const p=packets[i];if(now<p.born)continue;p.t+=(p.dir==='in'?1:-1)*p.sp*calm;if(p.t>=1||p.t<=0){if(p.dir==='in')arrive(p);packets.splice(i,1);}}return;}
  syncOrbits();
  const {brain,act,mix,nb,base,NP}=G;
  brain.rotation.y+=(reduce?0:.0016)+G.dragVX+(APP.busy&&!reduce?.004:0);brain.rotation.x=Math.max(-.6,Math.min(.9,brain.rotation.x+G.dragVY));
  G.dragVX*=.92;G.dragVY*=.9;
  G.core.rotation.y-=reduce?0:.006;G.core.rotation.x+=reduce?0:.003;G.ticks.rotation.z+=reduce?0:.0004;
  G.orbits.children.forEach(o=>{if(!reduce)o.rotation.z+=o.userData.spin;});
  G.halo.material.opacity=.14+(reduce?0:Math.sin(now/1500)*.04)+(APP.busy?.08:0);
  brain.updateMatrixWorld();
  // connections grow with learned rules
  const target=G.cum[1]+(G.cum[4]-G.cum[1])*Math.min(1,lessonsNow().length/10);
  G.edgeShown+=(target-G.edgeShown)*.04;G.lines.geometry.setDrawRange(0,Math.floor(G.edgeShown)*2);
  // waves: amber where info enters, mint as it spreads (raw info turning into understanding)
  for(let i=waveQ.length-1;i>=0;i--){const w=waveQ[i];if(now<w.t)continue;waveQ.splice(i,1);
    if(G.waveTag[w.n]===w.id)continue;G.waveTag[w.n]=w.id;act[w.n]=1;mix[w.n]=Math.min(1,w.d/3);
    if(w.d<w.maxD)nb[w.n].forEach(n=>{if(G.waveTag[n]!==w.id)waveQ.push({n,t:now+(reduce?0:70),d:w.d+1,id:w.id,maxD:w.maxD});});}
  const pc=G.points.geometry.attributes.color.array;
  for(let i=0;i<NP;i++){act[i]*=.955;const a=act[i],m=mix[i];const cr=AMB[0]+(MINT[0]-AMB[0])*m,cg=AMB[1]+(MINT[1]-AMB[1])*m,cb=AMB[2]+(MINT[2]-AMB[2])*m;
    pc[i*3]=base[i*3]*(1-a)+cr*a*1.4;pc[i*3+1]=base[i*3+1]*(1-a)+cg*a*1.4;pc[i*3+2]=base[i*3+2]*(1-a)+cb*a*1.4;}
  G.points.geometry.attributes.color.needsUpdate=true;
  const ec=G.lines.geometry.attributes.color.array,shown=Math.floor(G.edgeShown);
  for(let k=0;k<shown;k++){const[a,b]=G.edges[k];for(const[v,idx]of[[0,a],[1,b]]){const s=act[idx],o=k*6+v*3;ec[o]=.07+pc[idx*3]*.55*s+.03*(1-s);ec[o+1]=.09+pc[idx*3+1]*.55*s+.04*(1-s);ec[o+2]=.15+pc[idx*3+2]*.55*s+.06*(1-s);}}
  G.lines.geometry.attributes.color.needsUpdate=true;
  const lp=G.lanes.geometry.attributes.position.array,lc=G.lanes.geometry.attributes.color.array;let li=0;
  ms.forEach(m=>{const M=G.members[m.id];if(!M)return;const on=sel===m.id,dim=sel!=='brain'&&!on;
    M.core.material.opacity=on?.7:dim?.12:.32;M.glow.material.opacity=on?.12:dim?.02:.05;
    for(let i=0;i<16;i++){const t=((i/16)+(reduce?0:now*.00009))%1,p=sAt(m.id,t),f=(on?.55:dim?.08:.22)*Math.sin(t*Math.PI);lp.set([p.x,p.y,p.z],li*3);lc.set([AMB[0]*f,AMB[1]*f,AMB[2]*f],li*3);li++;}});
  G.lanes.geometry.setDrawRange(0,li);G.lanes.geometry.attributes.position.needsUpdate=true;G.lanes.geometry.attributes.color.needsUpdate=true;
  const hp=G.heads.geometry.attributes.position.array,hc=G.heads.geometry.attributes.color.array,tp=G.trails.geometry.attributes.position.array,tc=G.trails.geometry.attributes.color.array;
  let hn=0,tn=0;
  for(let i=packets.length-1;i>=0;i--){const p=packets[i];if(now<p.born)continue;if(!G.members[p.m]){packets.splice(i,1);continue;}
    const ds=p.dir==='in'?1:-1;p.t+=ds*p.sp*(reduce?3:1);
    if(p.t>=1||p.t<=0){if(p.dir==='in')arrive(p);else ringPing(p.m);packets.splice(i,1);continue;}
    if(hn>=240)continue;
    const dim=sel!=='brain'&&sel!==p.m?.25:1,col=p.dir==='in'?AMB:MINT,h=sAt(p.m,p.t);
    hp.set([h.x,h.y,h.z],hn*3);hc.set([col[0]*dim,col[1]*dim,col[2]*dim],hn*3);hn++;
    for(let s=1;s<=8;s++){const tt=p.t-ds*.009*s;if(tt<0||tt>1)break;const q=sAt(p.m,tt),f=(1-s/9)*.7*dim;if(tn>=1920)break;tp.set([q.x,q.y,q.z],tn*3);tc.set([col[0]*f,col[1]*f,col[2]*f],tn*3);tn++;}}
  G.heads.geometry.setDrawRange(0,hn);G.trails.geometry.setDrawRange(0,tn);
  ['position','color'].forEach(k=>{G.heads.geometry.attributes[k].needsUpdate=true;G.trails.geometry.attributes[k].needsUpdate=true;});
  if(APP.tab==='overview')G.renderer.render(G.scene,G.camera);
}
function arrive(p){
  if(G&&G.members[p.m]){const e=G.members[p.m].end,v=G.tmp,P=G.P;let best=0,bd=1e9;
    for(let i=0;i<440;i++){v.set(P[i*3],P[i*3+1],P[i*3+2]).applyMatrix4(G.brain.matrixWorld);const d=v.distanceToSquared(e);if(d<bd){bd=d;best=i;}}wave(best,4);}
  if(p.item){APP.signals++;const s=p.item.s;const txt=s.kind==='meeting'?`Meeting: ${s.label}`:s.kind==='slack'?`${first(s.who)}: ${s.text}`:`${s.label}`;
    $('#ticker').innerHTML=`<b>${APP.signals}</b> signal${APP.signals===1?'':'s'} · ${esc(p.item.id)} ${esc(txt.slice(0,70))}`;}
}
function ringPing(m){const el=$('#n-'+m+' .ring');if(el&&!reduce&&APP.tab==='overview')el.animate([{boxShadow:'0 0 0 0 rgba(110,231,200,.55)'},{boxShadow:'0 0 0 14px rgba(110,231,200,0)'}],{duration:700,easing:'ease-out'});}

/* ---------- boot ---------- */
has3D=init3D();
if(!has3D)stage.insertAdjacentHTML('beforeend','<p class="nogl">3D view needs WebGL. Everything else still works.</p>');
rebuildPeople(); peopleKey=members().map(m=>m.id+m.name).join('|');
setTab(APP.tab,true);
const relayout=()=>{has3D?layout3D():layoutFallback();moveInd();};
relayout();new ResizeObserver(relayout).observe(stage);addEventListener('resize',moveInd);
document.fonts&&document.fonts.ready.then(moveInd);
requestAnimationFrame(frame);
boot().then(()=>{if(APP.mode==='demo')showDay(Math.max(0,+(params.get('day')||1)-1));});
</script>
